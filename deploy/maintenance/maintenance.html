<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Back soon · listlinkedin</title>
    <!-- Served by nginx while deploy/maintenance/on exists (docs/deployment.md#maintenance-mode).
         Self-contained: the app and the API may be down. Colours: docs/design-system.md. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f2ff;
        --text: #1d1b20;
        --accent: #6927c8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141218;
          --text: #e6e0e9;
          --accent: #c3a8fc;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 1rem/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>We'll be right back</h1>
      <p>
        listlinkedin is being updated. Your lists and links are safe. Please try again in a few
        minutes.
      </p>
    </main>
  </body>
</html>
