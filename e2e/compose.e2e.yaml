# Additions to compose.prod.yaml for the end-to-end suite only (e2e/run.sh): a Mailpit
# server that catches account emails, so tests can open verification and reset links, and a
# fixture site whose details the worker fetches (http://fixture.test/).
services:
  api:
    environment:
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
      # Every browser shares one client IP here; allauth's per-IP limits would trip.
      AUTH_RATE_LIMITS: "off"
      # Specs about edit links still create V1 (legacy) lists; production answers 410.
      LEGACY_LIST_CREATION: "on"
      # Reports reach Mailpit (e2e/tests/report.spec.ts).
      MODERATION_EMAIL: moderation@example.test

  worker:
    environment:
      # Lets the fetcher reach the fixture site on the private compose network, for the
      # `.test` name only (apps.metadata.fetcher.test_hosts). Never set in production.
      FETCH_TEST_HOSTS: "fixture.test=fixture"
      # Nothing else: tests never reach the internet, and a link to example.com keeps its
      # host as its title instead of turning into "Example Domain" mid-test.
      FETCH_BLOCKED_NETWORKS: "0.0.0.0/0,::/0"

  fixture:
    image: nginx:1.30-alpine  # the same base as the production frontend image
    volumes:
      - ./e2e/fixture-site:/usr/share/nginx/html:ro

  mailpit:
    image: axllent/mailpit:v1.31
