# Releases the browser extension, on its own: a GitHub Release named after the tag
# `extension-v<version>`, with a zip per browser; then the Firefox build is submitted to
# addons.mozilla.org, where Firefox users install it (docs/extension.md, ADR-021, ADR-023).
#
# It is not a release of the site. The server deploys only `vX.Y.Z` releases, and only the
# one GitHub calls "latest" (ADR-018): this workflow never marks its release as latest.
name: Extension release

on:
  push:
    tags: ['extension-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag (extension-vX.Y.Z) to release again, after a failure
        required: true

permissions:
  contents: read

concurrency:
  group: extension-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # to create the release and add its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # The tag names the version the code says it is, and that code is on main.
      - name: Check the tag
        id: version
        run: |
          version=$(jq -r .version extension/package.json)
          if [ "$TAG" != "extension-v$version" ]; then
            echo "::error::The tag is $TAG, but extension/package.json says version $version (expected extension-v$version)."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # For production's address (the Dockerfile's default), and checked by Mozilla's linter.
      - name: Build the extension for Chrome and Firefox
        run: |
          docker build --target dev -t listlinkedin-extension:dev extension
          docker build --target export --output extension/dist extension
          docker run --rm -v "$PWD/extension/dist:/app/dist:ro" listlinkedin-extension:dev \
            npm run lint:firefox
          mkdir release
          cp extension/dist/listlinkedin-*.zip release/

      # Never "latest": that word is the site's, and the server deploys what carries it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -l release
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --latest=false \
              --title "Browser extension $VERSION" \
              --notes "The listlinkedin browser extension, version $VERSION, for https://listlinkedin.versioncontrol.xyz. Firefox: install it from https://addons.mozilla.org/firefox/addon/listlinkedin/ (once Mozilla has reviewed this version). Chrome and others: the zip below. How to install it: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/extension.md"
          fi

      # Last, so that a refusal by Mozilla leaves the GitHub Release in place. The Firefox
      # build goes to addons.mozilla.org as a listed add-on (ADR-023): Mozilla reviews it,
      # publishes it on the add-on's page and updates the installed copies itself. The listing's
      # texts are extension/amo-metadata.json. The step doesn't wait for the review. The keys
      # are the repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET; without them this step
      # says so and nothing is submitted. Mozilla takes each version once.
      - name: Submit the Firefox build to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::warning::No Mozilla keys (AMO_JWT_ISSUER, AMO_JWT_SECRET): this version was not submitted to addons.mozilla.org."
            exit 0
          fi
          # The readable source of the bundled code, which Mozilla asks for; extension/README.md
          # says how to build it.
          mkdir -p amo
          git archive --format=zip -o amo/source.zip HEAD extension
          cp extension/amo-metadata.json amo/
          # A copy of the build: web-ext keeps a note of its upload inside the folder it sends
          # (.amo-upload-uuid), so that folder can't be read-only.
          cp -r extension/dist/firefox amo/firefox
          docker run --rm -e WEB_EXT_API_KEY -e WEB_EXT_API_SECRET \
            -v "$PWD/amo:/amo" \
            listlinkedin-extension:dev \
            web-ext sign --no-config-discovery --channel listed --approval-timeout 0 \
              --source-dir /amo/firefox --artifacts-dir /amo \
              --amo-metadata /amo/amo-metadata.json \
              --upload-source-code /amo/source.zip
          echo "Submitted. Mozilla reviews it; it then appears on https://addons.mozilla.org/firefox/addon/listlinkedin/"
