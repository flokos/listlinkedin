# Runs the same Docker commands developers use locally; no Python on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build development image
        run: docker compose build api

      - name: Lint and format check
        run: docker compose run --rm --no-deps api sh -c "ruff check . && ruff format --check ."

      - name: Migrations are up to date
        run: docker compose run --rm api python manage.py makemigrations --check --dry-run

      - name: Tests (PostgreSQL)
        run: docker compose run --rm api pytest

      - name: Production image builds and passes deploy checks
        run: |
          docker build --target prod -t listlinkedin:prod backend
          docker run --rm \
            -e DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
            -e DJANGO_ALLOWED_HOSTS=go.example.test \
            -e PUBLIC_BASE_URL=https://go.example.test \
            -e POSTGRES_DB=ci -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_HOST=unused \
            listlinkedin:prod python manage.py check --deploy --fail-level WARNING

      - name: Frontend lint, format, unit tests and contrast check
        run: |
          docker build --target dev -t listlinkedin-frontend:dev frontend
          docker run --rm listlinkedin-frontend:dev sh -c \
            "npm run lint && npm run format:check && npm run test && npm run check:contrast"

      - name: Frontend type-check and production build
        run: docker build --target build frontend

      - name: Extension lint, format, type-check and unit tests
        run: |
          docker build --target dev -t listlinkedin-extension:dev extension
          docker run --rm listlinkedin-extension:dev sh -c \
            "npm run lint && npm run format:check && npm run type-check && npm run test"

      # The same pages and scripts for both browsers, each with its own manifest. Mozilla's
      # linter checks the Firefox build, which no browser test can load (extension/README.md).
      - name: Extension builds for Chrome and Firefox
        run: |
          docker build --target export --output extension/dist extension
          test -f extension/dist/chrome/manifest.json
          docker run --rm -v "$PWD/extension/dist:/app/dist:ro" listlinkedin-extension:dev \
            npm run lint:firefox
          ls extension/dist/listlinkedin-*-chrome.zip extension/dist/listlinkedin-*-firefox.zip
          # The site's "Browser extension" page links to the release of one extension version:
          # the one the extension's code says it is.
          version=$(jq -r .version extension/package.json)
          grep -qF "EXTENSION_VERSION = '$version'" frontend/src/utils/extensionDownloads.ts ||
            { echo "::error::frontend/src/utils/extensionDownloads.ts doesn't offer extension version $version"; exit 1; }

      # The builds of this commit, for production's address, to try by hand
      # (docs/extension.md). The Firefox one is unsigned: it loads as a temporary add-on.
      - name: Upload the extension builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: extension/dist/*.zip
          if-no-files-found: error
          retention-days: 14

      # Known vulnerabilities in the locked dependencies (task 9.1). pip-audit reports every
      # advisory with a fix; npm audit fails on high and critical ones. An advisory without a
      # fix is ignored explicitly, with its reason, in docs/v2/21-SECURITY-REVIEW.md.
      - name: Dependencies have no known vulnerabilities
        run: |
          docker run --rm -v "$PWD/backend:/app:ro" -w /app \
            ghcr.io/astral-sh/uv:0.9.5-python3.14-bookworm-slim sh -c \
            "uv export --frozen --no-emit-project > /tmp/requirements.txt && uvx pip-audit==2.10.1 --disable-pip -r /tmp/requirements.txt"
          docker run --rm listlinkedin-frontend:dev npm audit --audit-level=high
          docker run --rm listlinkedin-extension:dev npm audit --audit-level=high

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  proxy:
    # Full production stack behind nginx with a throwaway certificate: the Vue app, HTTPS redirect,
    # unknown-host refusal, body limits, header-spoofing resistance, unpublished API port.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Production smoke test behind nginx
        run: bash deploy/smoke-test.sh

  e2e:
    # Browser tests (Chromium, Firefox, WebKit, phone emulation) against the production stack
    # over HTTPS. Same command as locally; see e2e/README.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: End-to-end tests
        env:
          CI: "true"
          E2E_RETRIES: "1"
        run: bash e2e/run.sh

      - name: Upload test report
        # Also when the job passed: a test that failed once and passed on retry ("flaky")
        # leaves its trace in e2e/test-results/, and that trace is the only way to debug it.
        if: always() && hashFiles('e2e/test-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/report/
            e2e/test-results/
          retention-days: 14
