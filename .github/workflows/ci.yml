# Runs the same Docker commands developers use locally; no Python on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build development image
        run: docker compose build api

      - name: Lint and format check
        run: docker compose run --rm --no-deps api sh -c "ruff check . && ruff format --check ."

      - name: Migrations are up to date
        run: docker compose run --rm api python manage.py makemigrations --check --dry-run

      - name: Tests (PostgreSQL)
        run: docker compose run --rm api pytest

      - name: Production image builds and passes deploy checks
        run: |
          docker build --target prod -t listlinkedin:prod .
          docker run --rm \
            -e DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
            -e DJANGO_ALLOWED_HOSTS=go.example.test \
            -e PUBLIC_BASE_URL=https://go.example.test \
            -e POSTGRES_DB=ci -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_HOST=unused \
            listlinkedin:prod python manage.py check --deploy --fail-level WARNING

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
