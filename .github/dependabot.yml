# Dependency update pull requests (task 9.1, docs/v2/21-SECURITY-REVIEW.md#dependencies).
# GitHub reads this file from the default branch only, so it takes effect once V2 is on
# `main`. Security updates arrive as soon as an advisory is published; version updates are
# grouped weekly. Each pull request runs the full CI, including the vulnerability audit.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /e2e]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
